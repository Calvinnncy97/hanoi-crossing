[project]
name = "hanoi-crossing"
version = "0.1.0"
description = "Two-player, hidden-information Tower of Hanoi engine with replay, random-play and interactive CLI frontends"
readme = "README.md"
authors = [
    { name = "Calvinn Ng", email = "calvinnncy97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
